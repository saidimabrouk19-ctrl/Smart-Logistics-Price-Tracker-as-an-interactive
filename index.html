<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistrack - Smart Price Intelligence</title>
    <style>
        /* التنسيقات العامة والأساسية للموقع المظلم */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #030a16;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 410px;
            background-color: #051124;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid #0d2347;
            padding-bottom: 20px;
        }

        .app-header {
            background-color: #020813;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #0d2347;
        }

        .app-header h1 {
            font-size: 16px;
            letter-spacing: 2px;
            color: #ffffff;
            font-weight: 700;
        }

        .app-header p {
            font-size: 10px;
            color: #4f688a;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        /* شريط التبويبات الثلاثي */
        .tabs {
            display: flex;
            background-color: #030a16;
            border-bottom: 1px solid #0d2347;
        }

        .tab {
            flex: 1;
            padding: 14px 5px;
            text-align: center;
            font-size: 11px;
            color: #4f688a;
            cursor: pointer;
            letter-spacing: 1px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .tab.active {
            color: #3b82f6;
            background-color: #071731;
            border-bottom: 2px solid #3b82f6;
        }

        .main-content {
            padding: 20px;
        }

        .form-card {
            background-color: #071731;
            border: 1px solid #112d5a;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 11px;
            color: #3b82f6;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .inputs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .single-input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .single-input-group label, .input-group label {
            font-size: 9px;
            color: #4f688a;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-field {
            background-color: #030a16;
            border: 1px solid #112d5a;
            color: #ffffff;
            padding: 12px 6px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            outline: none;
            width: 100%;
        }

        .input-field-left {
            text-align: left;
            padding-left: 12px;
        }

        select.input-field {
            appearance: none;
            cursor: pointer;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='10' height='6' viewBox='0 0 10 6'><path fill='%234f688a' d='M0 0l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 6px center;
            padding-right: 15px;
        }

        .action-btn {
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            width: 100%;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* حاويات الحالة والنتائج المستقرة */
        .status-container {
            text-align: center;
            padding: 20px 10px;
        }

        .hexagon-icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 15px auto;
            border: 2px solid #112d5a;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        .status-text {
            font-size: 11px;
            color: #4f688a;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.6;
        }

        .ai-response-box {
            display: none;
            margin-top: 15px;
            padding: 20px;
            border-radius: 12px;
            background-color: #3B9EFF11;
            border: 1px solid #3B9EFF33;
            text-align: left;
        }

        .glow-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, #1E2D42, transparent);
            width: 100%;
        }

        /* ستايل كروت الاشتراكات وباقات الأسعار التجاري */
        .pricing-card {
            background-color: #071731;
            border: 1px solid #112d5a;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            text-align: left;
            position: relative;
        }
        .pricing-card.popular {
            border-color: #3b82f6;
            background-color: #0b2246;
        }
        .plan-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 8px;
            background-color: #3b82f6;
            padding: 2px 6px;
            border-radius: 20px;
            letter-spacing: 1px;
        }
        .plan-title {
            font-size: 14px;
            font-weight: 700;
        }
        .plan-price {
            font-size: 18px;
            font-weight: 700;
            color: #3b82f6;
            margin: 5px 0;
        }
        .plan-features {
            font-size: 11px;
            color: #a3b8cc;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .plan-btn {
            background-color: #030a16;
            border: 1px solid #112d5a;
            color: #ffffff;
            padding: 8px;
            width: 100%;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 600;
        }
        .pricing-card.popular .plan-btn {
            background-color: #3b82f6;
            border: none;
        }

        /* التبديل الهيكلي الصحيح */
        .page-section {
            display: none;
        }
        .page-section.active-section {
            display: block;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- الرأس الترحيبي والتجاري للتطبيق -->
        <div class="app-header">
            <h1>LOGISTRACK</h1>
            <p>SMART PRICE INTELLIGENCE</p>
        </div>

        <!-- شريط التبويبات الفعال -->
        <div class="tabs">
            <div class="tab active" id="tab-compare" onclick="switchTab('compare')">COMPARE</div>
            <div class="tab" id="tab-tracking" onclick="switchTab('tracking')">TRACKING</div>
            <div class="tab" id="tab-pricing" onclick="switchTab('pricing')">PRICING</div>
        </div>

        <div class="main-content">
            
            <!-- ================= قسم 1: مقارنة وحساب الأسعار ================= -->
            <div id="section-compare" class="page-section active-section">
                <div class="form-card">
                    <div class="card-title">• Shipment Parameters</div>
                    <div class="inputs-grid">
                        <div class="input-group">
                            <label>Weight (KG)</label>
                            <input type="number" id="weight" class="input-field" value="2">
                        </div>
                        <div class="input-group">
                            <label>Destination Zone</label>
                            <select id="zone" class="input-field">
                                <option value="EU Zone">EU Zone</option>
                                <option value="US Zon">US Zon</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Service Type</label>
                            <select id="service" class="input-field">
                                <option value="St1">St1</option>
                                <option value="Express">Express</option>
                            </select>
                        </div>
                    </div>
                    <button class="action-btn" onclick="performSearch()">Search</button>
                </div>
            </div>

            <!-- ================= قسم 2: تتبع الشحنات التفاعلي ================= -->
            <div id="section-tracking" class="page-section">
                <div class="form-card">
                    <div class="card-title">• Track Shipment</div>
                    <div class="single-input-group">
                        <label>Tracking Number / Order ID</label>
                        <input type="text" id="tracking-id" class="input-field input-field-left" placeholder="e.g. LT-84920-EU" value="LT-77301-PL">
                    </div>
                    <button class="action-btn" onclick="performTrack()">Track Status</button>
                </div>
