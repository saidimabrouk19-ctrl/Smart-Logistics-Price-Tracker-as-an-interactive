<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogisTrack - Global Shipment Tracking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 {
            color: #667eea;
            font-size: 2.5em;
        }

        header p {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        .content {
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        /* TRACKING SECTION */
        .tracking-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .input-group input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-group button {
            padding: 15px 40px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .input-group button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .result {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: none;
            margin-top: 20px;
        }

        .result.show {
            display: block;
        }

        .result h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .result p {
            color: #555;
            margin: 10px 0;
            font-size: 1.05em;
            line-height: 1.6;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            background: #e2e8f0;
            color: #4a5568;
            border-radius: 20px;
            font-size: 0.9em;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-top">
            <h1>LogisTrack</h1>
        </div>
        <p>Global Shipment Tracking System</p>
    </header>

    <div class="content">
        <div class="tracking-container">
            <div class="input-group">
                <input type="text" id="trackingInput" placeholder="Entrez le numéro de suivi (ex: T-77301-PL)">
                <button id="searchBtn">Recherche</button>
            </div>

            <!-- مربع ظهور النتائج -->
            <div class="result" id="resultBox">
                <h3>Détails de la cargaison</h3>
                <p><strong>Numéro:</strong> <span id="resNum">-</span></p>
                <p><strong>Emplacement:</strong> <span id="resLocation">-</span></p>
                <div class="status-badge" id="resStatus">Statut</div>
            </div>
        </div>
    </div>
</div>

<!-- استدعاء مكاتب فايربيس بشكل صحيح متوافق مع جميع المتصفحات والهواتف -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    // إعدادات فايربيس الخاصة بمشروعك
    const firebaseConfig = {
      apiKey: "AIzaSyBq_-yMBzDfK_9fA1fa2Jzpe0O87yw5UbY",
      authDomain: "://firebaseapp.com",
      projectId: "smart-logistics-f4f86",
      storageBucket: "smart-logistics-f4f86.firebasestorage.app",
      messagingSenderId: "227224904315",
      appId: "1:227224904315:web:62f74fb778562111e578de",
      measurementId: "G-RNWVXQW7ZW"
    };

    // تهيئة المشروع وقاعدة البيانات
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ربط زر البحث بالدالة البرمجية
    document.getElementById("searchBtn").addEventListener("click", async () => {
        const trackingInput = document.getElementById("trackingInput").value.trim();
        const resultBox = document.getElementById("resultBox");

        if (trackingInput === "") {
            alert("Veuillez entrer un numéro de suivi !");
            return;
        }

        try {
            // الاستعلام من مجموعة hameçonnage حسب رقم التتبع
            const q = query(collection(db, "hameçonnage"), where("trackingNumber", "==", trackingInput));
            const querySnapshot = await getDocs(q);

            if (!querySnapshot.empty) {
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    // تحديث واجهة المستخدم بالبيانات الحقيقية المستخرجة
                    document.getElementById("resNum").innerText = data.trackingNumber || trackingInput;
                    document.getElementById("resLocation").innerText = data.location || "Non spécifié";
                    document.getElementById("resStatus").innerText = data.status || "Aucun statut";
                    
                    // إظهار صندوق النتيجة
                    resultBox.style.display = "block";
                });
            } else {
                resultBox.style.display = "none";
                alert("Aucune cargaison trouvée avec ce numéro !");
            }
        } catch (error) {
            alert("Erreur Firebase: " + error.message);
        }
    });
</script>

</body>
</html>
